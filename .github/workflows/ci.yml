name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  platform-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.2
        with:
          version: "0.12.6"
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -q
      - name: Compile sources and tests
        run: uv run python -m compileall -q src tests

  # Keep one stable required check for branch protection while platform jobs
  # can expand without changing the protected-check name.
  test:
    if: ${{ always() }}
    needs: platform-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require all platform tests to pass
        if: ${{ needs.platform-tests.result != 'success' }}
        run: exit 1
      - name: Platform tests passed
        run: echo "All platform tests passed"
