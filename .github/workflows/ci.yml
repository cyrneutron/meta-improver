name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.6"
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -q
      - name: Compile sources and tests
        run: uv run python -m compileall -q src tests
